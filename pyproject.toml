[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tetris-ml-arena"
version = "0.1.0"
description = "Play Tetris against machine learning and deep learning agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.4",
    "gymnasium==1.4.0",
    "pygame-ce==2.5.8",
    "PyYAML==6.0.3",
    "torch==2.14.1",
    "neat-python==2.0.0",
    "tensorboard==2.21.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
tetris-arena = "tetris.ui.pygame.app:main"

[tool.setuptools.packages.find]
include = ["tetris*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
